[package]
name = "libp2p-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Keep the fuzz crate out of the parent rust-libp2p workspace so it can be
# built independently with cargo-fuzz's nightly flags.
[workspace]

# Path deps (swarm/plaintext/…) resolve `libp2p-identity` via crates.io by default.
# Patch so PeerId/Keypair match the local identity crate used by peer_id_from_bytes.
[patch.crates-io]
libp2p-identity = { path = "../../identity" }

[features]
default = []
# After Finding #1 is fixed upstream, enable to make Display→FromStr a hard assert.
hard_text_roundtrip = []
# Keep real `PublicKey::verify` under cargo-fuzz `--cfg fuzzing` (Strict Gossipsub
# signature lane). Default fuzz builds leave verify stubbed for Noise/swarm depth.
fuzzing-real-verify = ["libp2p-identity/fuzzing-real-verify"]

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
# Pinned to the version resolved in the rust-libp2p workspace (Cargo.lock).
# `asynchronous_codec` exposes `codec::Uvi` (same Decoder path mplex uses).
unsigned-varint = { version = "0.8", features = ["asynchronous_codec"] }
asynchronous-codec = "0.7"
bytes = "1"
futures = "0.3"

[dependencies.libp2p-core]
path = ".."

# Direct identity dep with all key types so peer_id_from_bytes can hit RSA /
# Secp256k1 / ECDSA protobuf+ASN.1 paths (core only enables ed25519+peerid).
[dependencies.libp2p-identity]
path = "../../identity"
features = ["peerid", "ed25519", "rsa", "secp256k1", "ecdsa", "rand"]

[dependencies.libp2p-mplex]
path = "../../muxers/mplex"
features = ["fuzzing"]

[dependencies.multistream-select]
path = "../../misc/multistream-select"
features = ["fuzzing"]

# Local checkout of yamux 0.14.0 (matches rust-libp2p Cargo.lock) with a
# `fuzzing` feature that exposes header + connection entry points. The crates.io
# package keeps `frame::header::{encode,decode}` crate-private.
[dependencies.yamux]
path = "../../../yamux/yamux"
features = ["fuzzing"]

# Gossipsub Behaviour action-sequence fuzzer (no transport).
[dependencies.libp2p-gossipsub]
path = "../../protocols/gossipsub"
features = ["fuzzing"]

# Kademlia Behaviour action-sequence fuzzer (no transport).
[dependencies.libp2p-kad]
path = "../../protocols/kad"
features = ["fuzzing"]

# Identify Behaviour / Handler mock-stream fuzzers (no transport).
[dependencies.libp2p-identify]
path = "../../protocols/identify"
features = ["fuzzing"]

[dependencies.libp2p-relay]
path = "../../protocols/relay"
features = ["fuzzing"]

[dependencies.libp2p-dcutr]
path = "../../protocols/dcutr"
features = ["fuzzing"]

[dependencies.libp2p-request-response]
path = "../../protocols/request-response"
features = ["fuzzing"]

[dependencies.libp2p-autonat]
path = "../../protocols/autonat"
features = ["fuzzing"]

# Swarm orchestrator: MemoryTransport + Noise XX / plaintext + yamux +
# connection-limits composed with gossipsub/kad/identify (`macros` for derive).
[dependencies.libp2p-swarm]
path = "../../swarm"
features = ["tokio", "macros"]

[dependencies.libp2p-connection-limits]
path = "../../misc/connection-limits"

# Plaintext kept for fuzz-selectable transport (regression / faster mesh).
[dependencies.libp2p-plaintext]
path = "../../transports/plaintext"

# Noise: swarm XX transport + payload/LP / structured XX harness target.
[dependencies.libp2p-noise]
path = "../../transports/noise"
features = ["fuzzing"]

# TLS: certificate parse/generate + structured mutual handshake upgrade.
[dependencies.libp2p-tls]
path = "../../transports/tls"
features = ["fuzzing"]

# QUIC: multiaddr parse + Config + quinn-proto Pair + swarm Security::Quic (tokio UDP).
[dependencies.libp2p-quic]
path = "../../transports/quic"
features = ["fuzzing", "tokio"]

[dependencies.libp2p-yamux]
path = "../../muxers/yamux"

[dependencies.tokio]
version = "1.53"
default-features = false
# `test-util` enables `time::pause` / `advance` for deterministic idle-timeout fuzzing.
# `net` is required for Security::Quic UDP loopback meshes in swarm_orchestrator.
features = ["rt", "time", "test-util", "net"]

