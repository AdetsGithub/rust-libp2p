[package]
name = "libp2p-kad"
edition.workspace = true
rust-version = { workspace = true }
description = "Kademlia protocol for libp2p"
version = "0.49.0"
authors = ["Parity Technologies <admin@parity.io>"]
license = "MIT"
repository = "https://github.com/libp2p/rust-libp2p"
keywords = ["peer-to-peer", "libp2p", "networking"]
categories = ["network-programming", "asynchronous"]

[dependencies]
bytes.workspace = true
either = "1.16"
fnv = "1.0"
asynchronous-codec = { workspace = true }
futures = { workspace = true }
libp2p-core = { workspace = true }
libp2p-swarm = { workspace = true }
futures-bounded = { workspace = true }
prost = { workspace = true }
prost-codec = { workspace = true }
libp2p-identity = { workspace = true, features = ["rand"] }
rand = { workspace = true }
sha2 = { workspace = true }
smallvec = "1.15"
uint = "0.10.2"
futures-timer = { workspace = true }
web-time = { workspace = true }
serde = { version = "1.0", optional = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }
loom = { version = "0.7", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
futures-timer = { workspace = true }
libp2p-identify = { path = "../identify" }
libp2p-noise = { workspace = true }
libp2p-swarm = { path = "../../swarm", features = ["macros", "tokio"] }
libp2p-swarm-test = { path = "../../swarm-test" }
libp2p-yamux = { workspace = true }
quickcheck = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[features]
serde = ["dep:serde", "bytes/serde"]
# Exposes `fuzz_behaviour` / `FuzzAction` / handler mock-I/O drivers for cargo-fuzz.
# Not intended for production use.
fuzzing = ["libp2p-swarm/fuzzing"]
# Loom concurrency models for QueryPool (not cargo-fuzz; do not enable in prod).
# Run: cargo test -p libp2p-kad --features loom --lib query::loom_tests
loom = ["dep:loom"]

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
