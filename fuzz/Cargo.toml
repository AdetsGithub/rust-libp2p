[package]
name = "rust-libp2p-fuzz"
version = "0.1.0"
authors = ["Your Name <your.email@example.com>"]
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "gossipsub_structured"
path = "../fuzz_targets/gossipsub_structured.rs"

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = "1.0"
# Direct dependency on the gossipsub protocol crate so the `fuzzing` feature is
# actually enabled (the umbrella `libp2p` crate does not forward it). This also
# matches how the `core/fuzz` crate wires up its gossipsub targets.
libp2p-gossipsub = { path = "../protocols/gossipsub", features = ["fuzzing"] }

# Enable fuzzing features
[features]
default = ["fuzzing"]
fuzzing = []
